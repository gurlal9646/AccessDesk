name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal

  web:
    name: Web tests and build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false --karma-config karma.conf.js --browsers=ChromeHeadlessCI
      - run: npx ng build

  migrations:
    name: Migrations on SQL Server
    runs-on: ubuntu-latest
    env:
      # Throwaway password for a container that only exists for this job.
      MSSQL_SA_PASSWORD: Ci-only-Passw0rd!
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P '${{ env.MSSQL_SA_PASSWORD }}' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool restore
      - name: Model and migrations agree
        run: dotnet ef migrations has-pending-model-changes --project src/AccessDesk.Api
      - name: Apply migrations to a real SQL Server
        run: >
          dotnet ef database update --project src/AccessDesk.Api
          --connection "Server=localhost,1433;Database=AccessDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      - name: Migrations are idempotent
        run: >
          dotnet ef database update --project src/AccessDesk.Api
          --connection "Server=localhost,1433;Database=AccessDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
