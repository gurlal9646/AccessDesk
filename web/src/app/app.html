<header class="topbar">
  <a class="brand" routerLink="/">AccessDesk</a>
  <nav aria-label="Main">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Requests</a>
    @if (session.isAdmin()) {
      <a routerLink="/audit" routerLinkActive="active">Audit log</a>
    }
  </nav>
  <div class="user">
    @if (session.isAuthenticated()) {
      <span class="who">
        {{ session.userName() }}
        <small>{{ session.roles().join(', ') }}</small>
      </span>
      <button type="button" class="secondary" (click)="session.logout()">Sign out</button>
    } @else {
      <button type="button" (click)="session.login()">Sign in</button>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
